site_name: AI Manager Mastery Path
site_description: A structured, module-wise AI management training program from entry level to master level, covering how to lead AI/ML teams, products, and initiatives.
site_url: https://sigilipelli.github.io/ai-manager-mastery-path/
repo_url: https://github.com/SIGILIPELLI/ai-manager-mastery-path
repo_name: ai-manager-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is AI Management?": level-1/01-what-is-ai-management.md
      - "02 · AI/ML Fundamentals for Managers": level-1/02-ai-ml-fundamentals-for-managers.md
      - "03 · Understanding AI Project Lifecycles": level-1/03-ai-project-lifecycles.md
      - "04 · Managing Data Science & ML Teams": level-1/04-managing-data-science-ml-teams.md
      - "05 · AI Ethics & Responsible AI Basics": level-1/05-ai-ethics-responsible-ai-basics.md
      - "06 · Setting AI Project Expectations": level-1/06-setting-ai-project-expectations.md
      - "07 · AI Vendor & Tool Evaluation Basics": level-1/07-ai-vendor-tool-evaluation.md
      - "08 · Communicating AI Concepts to Non-Technical Stakeholders": level-1/08-communicating-ai-to-stakeholders.md
      - "09 · AI Risk Basics": level-1/09-ai-risk-basics.md
      - "10 · Project — AI Project Charter & Risk Assessment": level-1/10-project-ai-charter-risk-assessment.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Managing ML Experimentation & Iteration": level-2/01-managing-ml-experimentation.md
      - "02 · AI Product Metrics": level-2/02-ai-product-metrics.md
      - "03 · MLOps Fundamentals for Managers": level-2/03-mlops-fundamentals-for-managers.md
      - "04 · Data Governance Basics": level-2/04-data-governance-basics.md
      - "05 · Managing Cross-Functional AI Teams": level-2/05-managing-cross-functional-ai-teams.md
      - "06 · AI Procurement & Build-vs-Buy Decisions": level-2/06-ai-procurement-build-vs-buy.md
      - "07 · Responsible AI Frameworks": level-2/07-responsible-ai-frameworks.md
      - "08 · Change Management for AI Adoption": level-2/08-change-management-ai-adoption.md
      - "09 · Budgeting for AI Projects": level-2/09-budgeting-for-ai-projects.md
      - "10 · Project — Design an MLOps Process for a Team": level-2/10-project-mlops-process.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-3/*.md
  level-4/*.md
